nameOverride: ""
fullnameOverride: ""

image:
  repository: xcbxcbxxabzc/course-app
  tag: "2.0"
  pullPolicy: Always

replicas: 1

service:
  type: ClusterIP
  port: 3000
  targetPort: 8080

config:
  LOG_LEVEL: info
  APP_NAME: course-app
  PORT: "8080"
  APP_STORE: redis

redis:
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 1Gi

ingress:
  enabled: true
  className: traefik
  host: course-app.local
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"

tls:
  create: true
  secretName: ""
  crt: 
  key: 
